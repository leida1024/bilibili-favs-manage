<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>收藏夹管理 · 虚构数据预览</title>
<style>
  body { margin: 24px; background: #eef3f8; color: #24364b; font: 15px/1.6 system-ui; }
  h1 { font-size: 24px; margin-bottom: 4px; }
  select { padding: 8px; }
</style>
<h1>收藏夹管理 · 交互预览</h1>
<p>全部为虚构数据。此页不加载 B 站脚本入口，不调用真实账号操作。</p>
<label>场景 <select id="scenario">
  <option value="ready">准备就绪</option><option value="empty">空列表</option>
  <option value="dense">40 个收藏夹</option><option value="many">长名称 / 多收藏夹</option><option value="running">运行中</option>
  <option value="failed">部分失败</option><option value="completed">已完成</option>
  <option value="interrupted">已中断</option>
</select></label>
<script type="module">
  import { PageDetector } from '../src/core/PageDetector.js';
  import { FloatingPanel } from '../src/ui/FloatingPanel.js';
  import { OperationState } from '../src/core/OperationState.js';
  import { InventoryService } from '../src/core/InventoryService.js';
  import { BatchOperations } from '../src/core/BatchOperations.js';
  import { panelPreferences, browserStore } from '../src/utils/preferences.js';
  import { LogStore } from '../src/utils/logStore.js';
  const names = ['编程入门', '摄影课堂', '音乐现场', '旅行灵感', '美食记录'];
  let panel;
  function render() {
    panel?.destroy();
    const scenario = document.querySelector('#scenario').value;
    const deleted = new Set();
    const manager = {
      modes: panelPreferences().modes,
      logs: new LogStore(500, browserStore('sessionStorage', 'fictional-preview-records')),
      inventory: new InventoryService({
        async folders(owner, kind) { return Array.from({ length: scenario === 'empty' ? 0 : ['dense', 'many'].includes(scenario) ? 40 : 5 }, (_, i) => ({ id: String(100 + i), ownerId: kind === 'subscribed' && i === 3 ? null : kind === 'created' ? '50' : '90', kind: kind === 'subscribed' && i === 4 ? 'unsupported' : kind, name: kind === 'subscribed' && i === 4 ? '虚构合集（暂不支持）' : `虚构收藏夹 ${i + 1}`, count: 2, protected: i === 0, available: true, subscribed: true })).filter(item => !deleted.has(item.id)); },
        async mutate(action, folder) { deleted.add(folder.id); return { status: 'confirmed', detail: '虚构操作，未发送网络请求' }; },
        async videos(id) { return { info: { id: Number(id), media_count: 2 }, has_more: false, medias: [{ id: 1, type: 2, duration: 60, upper: { mid: 90 } }, { id: 2, type: 2, duration: null }] }; }
      }, 400),
      operation: new OperationState(),
      getAllFavoriteNames: () => scenario === 'empty' ? [] : scenario === 'many'
        ? Array.from({ length: 40 }, (_, i) => `虚构收藏夹 ${i + 1} · 适合周末慢慢学习的摄影、旅行与编程课程合集`) : scenario === 'dense' ? Array.from({ length: 40 }, (_, i) => `虚构收藏夹 ${i + 1}`) : names,
      async batchCopy(tasks) {
        this.operation.begin('模拟复制', tasks.length);
        await new Promise(resolve => setTimeout(resolve, 800));
        this.operation.confirm('虚构任务完成');
        this.operation.finish('completed', '模拟完成，未发送任何网络请求');
      }
    };
    PageDetector.getLoginUserUID = () => '50';
    PageDetector.getCurrentPageUID = () => '60';
    manager.batchOperations = new BatchOperations(manager.inventory.client, () => ({ actor: '50', pageOwner: '50' }), 400);
    panel = new FloatingPanel(manager);
    panel.init();
    window.previewPanel = panel;
    if (scenario !== 'empty') {
      panel.favCheckboxItemList.slice(0, 2).forEach((item, i) => {
        item.checkbox.checked = true;
        item.inputText.value = ['学习资料', '摄影笔记'][i];
      });
      panel.updateSelectionReview();
    }
    panel.appendLog('虚构数据示例；跨页复制会携带同一任务的记录。');
    if (['running', 'failed', 'completed', 'interrupted'].includes(scenario)) {
      manager.operation.begin('模拟复制', 2);
      manager.operation.confirm('编程入门 → 学习资料');
      if (scenario !== 'running') manager.operation.finish(scenario,
        scenario === 'failed' ? '第 2 项未确认，请先检查页面结果。' : '模拟场景，不执行真实操作。');
      panel.setBusy(scenario === 'running');
      panel.appendLog('进度与结果显示在底部，详细记录显示在侧边。', scenario === 'failed' ? 0 : 1);
    }
    document.documentElement.dataset.previewReady = 'true';
  }
  document.querySelector('#scenario').addEventListener('change', render);
  render();
</script>
</html>
